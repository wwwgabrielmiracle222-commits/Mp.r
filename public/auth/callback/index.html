<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Authentication - MP.R Audio Studio</title>
  <style>
    body {
      background: #090d14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 26px;
      height: 26px;
      fill: #0b0f18;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    </div>
    <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #fff;">Connecting to GitHub</h2>
    <div class="spinner"></div>
    <p id="status-text" style="margin: 0; font-size: 14px; color: #94a3b8; line-height: 1.5;">
      Authentication in progress. Sending authorization code to MP.R Audio Studio...
    </p>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      const statusEl = document.getElementById('status-text');

      if (error) {
        if (statusEl) statusEl.textContent = 'Error: ' + (errorDescription || error);
        statusEl.style.color = '#f87171';
      }

      if (window.opener) {
        window.opener.postMessage({
          type: 'OAUTH_AUTH_SUCCESS',
          provider: 'github',
          code: code,
          state: state,
          error: error ? (errorDescription || error) : null
        }, '*');

        if (!error) {
          if (statusEl) statusEl.textContent = 'Authentication successful! Closing window...';
          setTimeout(function() {
            window.close();
          }, 400);
        }
      } else {
        // Not inside a popup
        setTimeout(function() {
          window.location.href = '/';
        }, 2000);
      }
    })();
  </script>
</body>
</html>
